<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>4 Anos de Nosso Amor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle 800px at -5% 10%, rgba(200, 100, 255, 0.25), transparent 30%),
        radial-gradient(circle 800px at 105% -5%, rgba(168, 85, 247, 0.25), transparent 35%),
        radial-gradient(circle 800px at -5% 105%, rgba(168, 85, 247, 0.2), transparent 35%),
        radial-gradient(circle 800px at 110% 105%, rgba(200, 100, 255, 0.22), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.5);
      border-radius: 3px;
    }

    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    .splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-btn {
      padding: 1.2rem 3rem;
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      border: 2px solid rgba(168, 85, 247, 0.5);
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.4s;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
      animation: pulseBtn 2s ease-in-out infinite;
    }

    .start-btn.pulse {
      animation: pulseBtn 0.35s ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .lyrics-box.active {
      border-color: rgba(255, 192, 253, 0.75);
      box-shadow: 0 0 50px rgba(192, 132, 252, 0.18);
      background: rgba(48, 18, 90, 0.75);
    }

    .start-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 80px rgba(168, 85, 247, 0.5);
      border-color: rgba(168, 85, 247, 1);
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    .container {
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-out 0.5s;
      pointer-events: none;
    }

    .container.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .header-counter {
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(10px);
      padding: 1.5rem 1rem;
      z-index: 100;
      border-bottom: 1px solid rgba(168, 85, 247, 0.1);
    }

    .counter-display {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      max-width: 1400px;
      margin: 0 auto;
      align-items: center;
    }

    .counter-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      min-width: -moz-fit-content;
      min-width: fit-content;
    }

    .counter-value {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      font-family: "Playfair Display", serif;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
      line-height: 1;
    }

    .counter-label {
      font-size: clamp(0.65rem, 1vw, 0.85rem);
      color: #a0a0c0;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
    }

    .separator {
      font-size: clamp(1.5rem, 4vw, 3rem);
      color: #c084fc;
      opacity: 0.5;
      line-height: 1;
      margin: 0 0.5rem;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-family: "Playfair Display", serif;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff, #d8b4fe);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(168, 85, 247, 0.3);
      animation: fadeInDown 1s ease-out;
    }

    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #d8b4fe;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3rem;
      opacity: 0.9;
      animation: fadeInUp 1.2s ease-out;
    }

    .scroll-arrow {
      width: 35px;
      height: 35px;
      border: 2px solid rgba(168, 85, 247, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      transition: all 0.3s;
      animation: fadeInUp 1.4s ease-out;
    }

    .scroll-arrow:hover {
      border-color: rgba(168, 85, 247, 1);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
    }

    .scroll-arrow::after {
      content: "↓";
      color: #c084fc;
      font-size: 1.3rem;
      animation: bounce-arrow 2s infinite;
    }

    @keyframes bounce-arrow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gallery-section {
      padding: 5rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .separator {
        display: none;
      }

      .counter-display {
        gap: 0.5rem;
      }
    }

    .photo-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.2);
      aspect-ratio: 3/4;
      cursor: pointer;
      transition: all 0.4s;
      animation: fadeInUp 0.7s ease-out backwards;
    }

    .photo-card:hover {
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.25);
      transform: translateY(-8px);
    }

    .photo-card img,
    .photo-card video {
      width: 100%;
      height: 100%;
      -o-object-fit: cover;
         object-fit: cover;
      -o-object-position: center;
         object-position: center;
      display: block;
    }

    .lyrics-box {
      background: rgba(20, 10, 35, 0.4);
      backdrop-filter: blur(15px);
      border: 1.5px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeInUp 0.7s ease-out backwards;
    }

    .lyrics-text {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-family: "Playfair Display", serif;
      font-weight: 700;
      color: #d8b4fe;
      line-height: 1.8;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .ending-section {
      padding: 6rem 2rem;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .ending-section h2 {
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-family: "Playfair Display", serif;
      font-weight: 900;
      margin-bottom: 2.5rem;
      background: linear-gradient(135deg, #d8b4fe, #c084fc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ending-section p {
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 2;
      color: #d0d0e0;
      margin-bottom: 2rem;
    }

    .spotify-embed {
      margin-top: 3rem;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.2);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    iframe {
      width: 100%;
      height: 152px;
      border: none;
    }

    @media (max-width: 480px) {
      .hero h1 {
        margin-bottom: 2rem;
      }

      .ending-section {
        padding: 4rem 1.5rem;
      }

      iframe {
        height: 140px;
      }
    }

    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.01;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .music-player {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(20, 10, 35, 0.95);
      backdrop-filter: blur(15px);
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      border-radius: 50px;
      padding: 1rem 1.2rem;
      z-index: 500;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .music-player button {
      background: rgba(168, 85, 247, 0.3);
      border: 1px solid rgba(168, 85, 247, 0.6);
      color: #d8b4fe;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-player button:hover {
      background: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
    }

    .music-info {
      color: #d8b4fe;
      font-size: 0.8rem;
      min-width: 100px;
    }

    @media (max-width: 768px) {
      .music-player {
        bottom: 1rem;
        right: 1rem;
      }

      .music-info {
        display: none;
      }
    }
  </style>
